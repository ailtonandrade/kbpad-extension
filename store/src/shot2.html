<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .wrap { padding: 70px 90px; }
  .cards { margin-top: 60px; display: flex; gap: 40px; align-items: center; }
  .card { flex: 1; background: #ffffff10; border: 1px solid #ffffff22; border-radius: 18px; padding: 34px; }
  .card h2 { margin: 0 0 22px; font-size: 30px; }
  .row { display: flex; align-items: center; gap: 14px; margin: 14px 0; font-size: 21px; color: #e5e7eb; }
  .swap { text-align: center; }
  .swap .key { font-size: 26px; min-width: 70px; height: 70px; }
  .swap div { margin-top: 14px; color: #c4b5fd; font-size: 20px; }
</style></head>
<body><div class="wrap">
  <h1>Troca rápida de preset</h1>
  <p class="sub">Um mapeamento para andar, outro para dirigir. Uma tecla alterna.</p>
  <div class="cards">
    <div class="card"><h2>🚶 A pé</h2>
      <div class="row"><span class="key">Shift</span> correr</div>
      <div class="row"><span class="key">Espaço</span> pular</div>
      <div class="row"><span class="key">F</span> entrar no veículo</div>
    </div>
    <div class="swap"><span class="key">F9</span><div>alterna</div></div>
    <div class="card"><h2>🚗 Veículo</h2>
      <div class="row"><span class="key">W</span><span class="key">S</span> acelerar / frear</div>
      <div class="row"><span class="key">Espaço</span> freio de mão</div>
      <div class="row"><span class="key">F</span> sair do veículo</div>
    </div>
  </div>
  <div style="margin-top:50px;text-align:center"><span class="hud">🔁 Ação (veículos)</span></div>
</div></body></html>
