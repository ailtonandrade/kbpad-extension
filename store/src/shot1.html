<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .wrap { padding: 70px 90px; }
  .grid { margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 70px; }
  .map { display: flex; align-items: center; gap: 18px; font-size: 22px; color: #e5e7eb; }
  .map .what { margin-left: 6px; color: #9ca3af; font-size: 19px; }
</style></head>
<body><div class="wrap">
  <img src="../icon.svg" width="84" style="float:right">
  <h1>Teclado e mouse viram controle</h1>
  <p class="sub">Jogue na nuvem pelo Chrome sem ter um gamepad.</p>
  <div class="grid">
    <div class="map"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="arrow">→</span>Analógico esquerdo</div>
    <div class="map"><span class="key">🖱 mover</span><span class="arrow">→</span>Analógico direito</div>
    <div class="map"><span class="key">🖱 esq.</span><span class="arrow">→</span><span class="btn" style="background:#374151">RT</span><span class="what">atirar / acelerar</span></div>
    <div class="map"><span class="key">🖱 dir.</span><span class="arrow">→</span><span class="btn" style="background:#374151">LT</span><span class="what">mirar / frear</span></div>
    <div class="map"><span class="key">Espaço</span><span class="arrow">→</span><span class="btn" style="background:#16a34a">A</span></div>
    <div class="map"><span class="key">C</span><span class="arrow">→</span><span class="btn" style="background:#dc2626">B</span></div>
    <div class="map"><span class="key">R</span><span class="arrow">→</span><span class="btn" style="background:#2563eb">X</span></div>
    <div class="map"><span class="key">1</span><span class="arrow">→</span><span class="btn" style="background:#ca8a04">Y</span></div>
  </div>
</div></body></html>
